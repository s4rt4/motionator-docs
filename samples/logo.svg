<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <!-- Motionator sample: a line-art logo for the draw-on tutorial. Every part has an id, so
       each becomes its own layer. Strokes (not fills) are what Trim Paths draws on. -->
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F15A24"/>
      <stop offset="0.45" stop-color="#FF0000"/>
      <stop offset="1" stop-color="#662D91"/>
    </linearGradient>
  </defs>
  <g id="Mark">
    <circle id="Ring" cx="230" cy="225" r="110" fill="none" stroke="url(#brand)" stroke-width="16" stroke-linecap="round"/>
    <path id="Wave" d="M150 255 C 185 150, 215 150, 230 225 S 275 300, 310 195" fill="none" stroke="#1f2937" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    <circle id="Dot" cx="310" cy="160" r="14" fill="#FF0000"/>
  </g>
  <g id="Wordmark">
    <path id="Letter_M" d="M390 280 V170 L430 230 L470 170 V280" fill="none" stroke="#1f2937" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    <circle id="Letter_O" cx="535" cy="225" r="52" fill="none" stroke="#1f2937" stroke-width="14"/>
    <path id="Letter_V" d="M610 172 L645 278 L680 172" fill="none" stroke="#1f2937" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    <path id="Letter_E" d="M760 172 H712 V278 H760 M712 225 H748" fill="none" stroke="#1f2937" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <rect id="Underline" x="390" y="310" width="370" height="10" rx="5" fill="url(#brand)"/>
</svg>
